# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
et -g @plugin 'christoomey/vim-tmux-navigator'

# continuum options
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'

# status line modules consumed by catppuccin below
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux#v2.3.0' # See https://github.com/catppuccin/tmux/tags for additional tags

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"
set -g extended-keys-format csi-u

# Configure the catppuccin plugin
# "custom" so the separators below apply; the built-in styles only cover
# basic/rounded/slanted. Powerline triangles instead of rounded caps, so each
# window's right point merges straight into the next window. The point glyph is
# drawn fg=this segment on bg=the next window's leading color, so no status-bar
# background shows between windows. That target color has to be chosen per
# window: the status bar background after the last window, mauve when the next
# window is the active one, otherwise the normal index color. `reverse` swaps
# the inherited segment color into the foreground so each window points in its
# own color. The left edge is a plain space: padding for the index, no glyph.
# Keep window indices contiguous: the incoming-arrow color test identifies the
# window after the active one by index+1, which only holds without gaps.
set -g renumber-windows on

# sesh session picker in a popup; the built-in TUI needs no fzf. The stock
# chooser stays on prefix+S. detach-on-destroy off keeps tmux alive when the
# last window of a session goes away, which sesh's docs recommend.
set -g detach-on-destroy off
set -g popup-border-style "fg=#{@thm_session_green}"
bind -N "session picker (sesh)" s display-popup -E -h 70% -w 60% -b rounded -T " sesh " "sesh picker -i"
bind -N "session chooser (built-in)" S choose-tree -Zs

# E: forces recursive expansion so the conditional resolves at draw time
set -g @catppuccin_status_session_text_bg "#{E:@thm_session_text}"

set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "##{?window_start_flag,#[fg=#{@thm_session_text}],##{?##{==:##{window_index},##{e|+:##{active_window_index},1}},#[fg=#{@thm_active_text}],#[fg=#{@thm_surface_0}]}}#[fg=#{@thm_crust}] "
set -g @catppuccin_window_middle_separator " #[fg=#{@thm_overlay_2},bg=#{@thm_surface_0}]"
set -g @catppuccin_window_current_middle_separator " #[fg=#{@thm_mauve},bg=#{@thm_active_text}]"
# Uniform text-box color so an arrow never has to know whether its neighbour
# is the active window; the purple index box stays the active indicator.
set -g @catppuccin_window_current_text_color "#{@thm_active_text}"
# Window text: two-dot abbreviation instead of the app-supplied ellipsis,
# plus a trailing pad before the next window's arrow.
set -g @catppuccin_window_text " #{s/…/../:pane_title} "
set -g @catppuccin_window_current_text " #{s/…/../:pane_title} "
set -g @catppuccin_window_right_separator "##{?window_end_flag,#[fg=#{@_ctp_status_bg}]#[reverse]#[none],}"

# Gruvbox dark palette, to match the Ghostty theme. The flavor files set these
# with `set -ogq`, which skips any option already set, so defining them here
# (before the plugin loads) overrides catppuccin's colors while keeping its
# status modules and window styling.
set -g @thm_bg "#282828"
set -g @thm_fg "#ebdbb2"

set -g @thm_rosewater "#fbf1c7"
set -g @thm_flamingo "#f2e5bc"
set -g @thm_pink "#d3869b"
set -g @thm_mauve "#d3869b"
set -g @thm_red "#fb4934"
set -g @thm_maroon "#cc241d"
set -g @thm_peach "#fe8019"
set -g @thm_yellow "#fabd2f"
set -g @thm_green "#b8bb26"
set -g @thm_teal "#8ec07c"
set -g @thm_sky "#83a598"
set -g @thm_sapphire "#83a598"
set -g @thm_blue "#458588"
set -g @thm_lavender "#d5c4a1"

set -g @thm_subtext_1 "#d5c4a1"
set -g @thm_subtext_0 "#bdae93"
set -g @thm_overlay_2 "#a89984"
set -g @thm_overlay_1 "#928374"
set -g @thm_overlay_0 "#7c6f64"
set -g @thm_surface_2 "#665c54"
set -g @thm_surface_1 "#504945"
set -g @thm_surface_0 "#3c3836"
# active window text box: surface tone warmed toward mauve
set -g @thm_active_text "#4a3f48"
# session name box: surface tone warmed toward green, or toward red while the
# prefix key is pending, mirroring the session icon.
set -g @thm_session_green "#3f4736"
set -g @thm_session_red "#4a3836"
set -g @thm_session_text "#{?client_prefix,#{E:@thm_session_red},#{E:@thm_session_green}}"
set -g @thm_mantle "#1d2021"
set -g @thm_crust "#141617"

# Load catppuccin ahead of the status line below, which expands its modules with -F
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# source
unbind r
bind r source-file ~/.tmux.conf

# keeps window in same directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# lets the terminal report Ctrl+Shift+<letter> distinctly from Ctrl+<letter>
# (needs a terminal that supports it, e.g. iTerm2, Kitty, WezTerm, Ghostty)
set -s extended-keys on

# swap windows (tabs) left/right with prefix + Shift-h/l, staying focused
# on the window we just moved (swap-window already follows without -d)
bind-key -r H swap-window -t -1
bind-key -r L swap-window -t +1


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# copy-mode selection: surface tone warmed toward mauve, a lighter sibling of
# @thm_active_text so the selection reads as the same family. Has to sit below
# tpm: tpm runs every *.tmux in each plugin dir, so it loads catppuccin a second
# time and that pass reassigns mode-style with a plain `set -gF`. Background
# only, so the selected text keeps whatever colors the pane already drew it in.
set -g mode-style "bg=#584d56,bold"
